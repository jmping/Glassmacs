exposure = "Glassmacs compiles only the Swift launcher and the Objective-C lifecycle module; Emacs itself is the pinned upstream universal build, so toolchain exposure is much smaller than Aquamacs's."
layers = ["B", "D"]
tests = ["ci:Test Glassmacs bootstrap package", "ci:Build standalone app bundle"]
implemented = "yes"
automated = "partial"
packaged_app = "ci"
clean_machine = "NOT RUN"
manual = ["Build with scripts/build-macos-app on the newest macOS and Xcode release (Tahoe) and on macOS 13 with its Xcode; record versions."]
rationale = "CI builds on the macos-15 runner image only; other macOS/Xcode versions are a follow-up runner matrix."

