# Glassmacs acceptance matrix (issue #34).
#
# One entry per risk.  `scripts/acceptance-matrix check` validates this file
# (every referenced test, scenario and CI step must exist, every issue #34
# Aquamacs report must be covered) and that the generated documents
# docs/acceptance-matrix.md and docs/macos-acceptance-checklist.md are
# current; `scripts/acceptance-matrix render` regenerates them.
#
# Fields:
#   evidence   upstream reports (aquamacs#N: aquamacs-emacs/aquamacs-emacs
#              issue N), Glassmacs findings (glassmacs:...) or policy
#   exposure   how Glassmacs could be affected
#   layers     A batch/unit, B packaged-app static, C GUI on CI,
#              D physical / clean machine / manual
#   tests      ert:NAME (tests/*.el), py:NAME (tests/*.py), swift:NAME
#              (macos/Tests), gui:NAME (scripts/macos-gui-acceptance),
#              ci:STEP (a step name in .github/workflows/ci.yml)
#   implemented          yes | partial | no
#   automated            yes | partial | no
#   packaged_app         ci (checked on the packaged app in every CI run) |
#                        NOT RUN
#   clean_machine        NOT RUN until someone records a dated result
#   manual               Layer D steps, listed in the checklist
#
# A green batch run never counts as GUI acceptance: packaged_app is "ci"
# only when a Layer B check or Layer C scenario runs against the app.

reviewed = "2026-10-29"

[[check]]
id = "DIST-001"
title = "Bundled native libraries resolve inside the app"
severity = "P0"
evidence = ["aquamacs#243"]
exposure = "The pinned upstream Cocoa Emacs links libgccjit and friends from /nix/store; the build relocates them into the bundle."
layers = ["B"]
tests = ["py:test_validator_shell_entrypoint_runs_with_literal_python_heredoc", "py:test_dependency_relocator_targets_the_unique_arch_compatible_bundle_library", "py:test_dependency_relocator_requires_a_library_for_every_binary_architecture", "py:test_rpath_sanitizer_cleans_all_binaries_but_preserves_relocatable_entries", "ci:Build standalone app bundle", "ci:Verify relocation"]
implemented = "yes"
automated = "yes"
packaged_app = "ci"
clean_machine = "NOT RUN"
manual = ["On a Mac without Homebrew, Nix or Xcode, launch the app and open an .R file; Console.app shows no dyld errors."]

[[check]]
id = "DIST-002"
title = "Apple Silicon and Intel architectures"
severity = "P0"
evidence = ["aquamacs#264", "aquamacs#268"]
exposure = "A missing slice crashes at launch on that architecture."
layers = ["B", "D"]
tests = ["py:test_validator_shell_entrypoint_runs_with_literal_python_heredoc", "ci:Build standalone app bundle"]
implemented = "yes"
automated = "partial"
packaged_app = "ci"
clean_machine = "NOT RUN"
manual = ["Launch the same build on an Intel Mac and on Apple Silicon without Rosetta; open, edit and save a file on each."]
rationale = "CI runs on Apple Silicon only; the Intel slice is checked statically."

[[check]]
id = "DIST-003"
title = "No build-machine paths in the app"
severity = "P0"
evidence = ["aquamacs#243"]
exposure = "Glassmacs-compiled binaries could embed the checkout or temporary build paths; any binary could embed the app's own location."
layers = ["B"]
tests = ["py:test_validator_shell_entrypoint_runs_with_literal_python_heredoc", "ci:Verify relocation"]
implemented = "yes"
automated = "yes"
packaged_app = "ci"
clean_machine = "NOT RUN"
rationale = "Upstream /nix/store, Homebrew and /usr/local strings are counted, not failed: runtime linkage outside the bundle is rejected separately and libgccjit's embedded paths serve only the disabled JIT compiler."

[[check]]
id = "DIST-004"
title = "Code signature, permissions and executables"
severity = "P0"
evidence = ["aquamacs#264", "aquamacs#268"]
exposure = "Editing Mach-O files invalidates signatures, which arm64 macOS enforces with SIGKILL at exec."
layers = ["B"]
tests = ["py:test_validator_shell_entrypoint_runs_with_literal_python_heredoc", "py:test_build_sanitizes_before_strict_bundle_validation", "ci:Build standalone app bundle"]
implemented = "yes"
automated = "yes"
packaged_app = "ci"
clean_machine = "NOT RUN"

[[check]]
