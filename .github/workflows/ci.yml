name: CI

on:
  # PR events validate feature branches. The push trigger is only for the
  # integrated branch so each feature-branch commit does not queue a duplicate
  # macOS build and build.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      emacs: ${{ steps.paths.outputs.emacs }}
      ess: ${{ steps.paths.outputs.ess }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          fi
          # Shared Emacs configuration and tests need the fast ERT gate.
          emacs=false; ess=false; macos=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              lisp/*|init.el|tests/*|scripts/test|scripts/acceptance-matrix|scripts/macos-gui-acceptance|docs/acceptance-matrix*|.github/workflows/ci.yml) emacs=true ;;
            esac
            case "$file" in
              lisp/glassmacs-r*|lisp/glassmacs-sessions.el|lisp/glassmacs-ess*|lisp/glassmacs-packages.el|tests/*ess*|tests/*r-*|tests/r-*|scripts/bundle-ess|.github/workflows/ci.yml) ess=true ;;
            esac
            case "$file" in
              macos/*|scripts/build-macos-app|scripts/validate-macos-app|scripts/update-build-sign|scripts/notarize-staple|scripts/bundle-ess|lisp/*|init.el|tests/*|scripts/macos-gui-acceptance|.github/workflows/ci.yml) macos=true ;;
            esac
          done <<< "$changed"
          echo "emacs=$emacs" >> "$GITHUB_OUTPUT"
          echo "ess=$ess" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          printf 'Changed paths:\n%s\nGates: emacs=%s ess=%s macos=%s\n' "$changed" "$emacs" "$ess" "$macos"

  emacs-batch:
    needs: changes
    if: needs.changes.outputs.emacs == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox
          emacs --version
      - name: Run ERT tests
        run: ./scripts/test
      - name: Test macOS release scripts with mocked Apple tools
        run: python3 -m unittest discover -s tests -p 'test_macos_release_scripts.py'
      - name: Check the acceptance matrix
        # Every referenced test, scenario and CI step must exist, and the
        # generated matrix and checklist documents must be current.
        run: ./scripts/acceptance-matrix check
      - name: Self-test the GUI acceptance harness with terminal Emacs
        # Runs the platform-independent scenarios against a live Emacs in a
        # pseudo-terminal, which checks the driver and harness themselves.
        run: ./scripts/macos-gui-acceptance --tty "$RUNNER_TEMP/tty-acceptance"
      - name: Byte-compile Lisp modules
        run: |
          emacs -Q --batch -l init.el \
            --eval '(let ((byte-compile-dest-file-function
                           (lambda (file)
                             (expand-file-name (file-name-nondirectory file)
                                               temporary-file-directory))))
                      (dolist (file (directory-files "lisp" t "\\.el$"))
                        (byte-compile-file file)))'

  ess-r-integration:
    needs: changes
    if: needs.changes.outputs.ess == 'true'
    runs-on: ubuntu-24.04
    # A stuck package installation must fail the job, not hang it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs, R, ESS, AUCTeX, Hunspell, Shiny and R Markdown
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox r-base-core elpa-ess auctex hunspell hunspell-en-us r-cran-shiny r-cran-rmarkdown pandoc elpa-markdown-mode
      - name: Verify real R graphics device lifecycle
        run: Rscript --vanilla tests/r-graphics-device.R
      - name: Install pinned polymode and poly-R
        # Not packaged for Ubuntu; fetch exact upstream commits so the mixed
        # document tests run against known versions.
        run: |
          fetch() {
            mkdir -p "$RUNNER_TEMP/elisp/$2"
            git -C "$RUNNER_TEMP/elisp/$2" init --quiet
            git -C "$RUNNER_TEMP/elisp/$2" fetch --quiet --depth 1 "https://github.com/$1" "$3"
            git -C "$RUNNER_TEMP/elisp/$2" checkout --quiet FETCH_HEAD
          }
          fetch polymode/polymode polymode 8cb72fa5dcc0d98746c680043dc121edc7621e3a
          fetch polymode/poly-markdown poly-markdown 2eb00d1d07a9dd5d94c5c12c27714e095b3b142a
          fetch polymode/poly-noweb poly-noweb 2074950bafd21f7237bc5eb3f92772a3fa7f0701
          fetch polymode/poly-R poly-R fee0b6e99943fa49ca5ba8ae1a97cbed5ed51946
      - name: Run ERT with real ESS, R, AUCTeX and polymode
        run: |
          ess_dir=$(dirname "$(dpkg -L elpa-ess | grep '/ess-site.el$' | head -n 1)")
          auctex_dir=$(dirname "$(dpkg -L auctex | grep '/latex.el$' | head -n 1)")
          markdown_dir=$(dirname "$(dpkg -L elpa-markdown-mode | grep '/markdown-mode.el$' | head -n 1)")
          test -n "$ess_dir"
          test -n "$auctex_dir"
          test -n "$markdown_dir"
          poly="$RUNNER_TEMP/elisp"
          # AUCTeX also needs tex-site.el from the site-lisp directory.
          EMACSLOADPATH="$ess_dir:$auctex_dir:$markdown_dir:$poly/polymode:$poly/poly-markdown:$poly/poly-noweb:$poly/poly-R:/usr/share/emacs/site-lisp:" ./scripts/test

  macos-launcher:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test Glassmacs bootstrap package
        run: swift test --package-path macos
      - name: Build standalone app bundle
        run: |
          ./scripts/build-macos-app "$RUNNER_TEMP/Glassmacs.app"
          ./scripts/validate-macos-app "$RUNNER_TEMP/Glassmacs.app"
      - name: Run ERT with the bundled Emacs
        env:
          GLASSMACS_EMACS: ${{ runner.temp }}/Glassmacs.app/Contents/MacOS/Emacs
          GLASSMACS_HOME: ${{ runner.temp }}/glassmacs-test-home
        run: ./scripts/test
      - name: Verify bootstrap with bundled configuration
        env:
          GLASSMACS_HOME: ${{ runner.temp }}/glassmacs-bootstrap-test-home
        run: |
          "$RUNNER_TEMP/Glassmacs.app/Contents/MacOS/GlassmacsBootstrap" \
            --batch --eval '(progn (require (quote glassmacs)) (princ "glassmacs-ready"))' \
            | grep -qx glassmacs-ready
      - name: Verify relocation
        run: |
          mkdir -p "$RUNNER_TEMP/relocated"
          ditto "$RUNNER_TEMP/Glassmacs.app" "$RUNNER_TEMP/relocated/Glassmacs.app"
          ./scripts/validate-macos-app "$RUNNER_TEMP/relocated/Glassmacs.app"
      - name: Verify the app does not load the user's Emacs init files
        # An interactive start, so -Q matters (--batch implies -q).  The
        # trap init files record that they ran; they must not.
        run: |
          trap_home="$RUNNER_TEMP/trap-home"
          mkdir -p "$trap_home/.emacs.d"
          for name in early-init.el init.el; do
            printf '(write-region "%s" nil "%s/loaded" t)\n' "$name" "$trap_home" \
              > "$trap_home/.emacs.d/$name"
          done
          HOME="$trap_home" GLASSMACS_HOME="$RUNNER_TEMP/trap-glassmacs-home" TERM=xterm \
            perl -e 'alarm 120; exec @ARGV' \
            script -q /dev/null "$RUNNER_TEMP/Glassmacs.app/Contents/MacOS/GlassmacsBootstrap" \
            -nw --eval '(kill-emacs 0)' < /dev/null
          if [ -e "$trap_home/loaded" ]; then
            printf 'The packaged app loaded user init files: %s\n' "$(cat "$trap_home/loaded")" >&2
            exit 1
          fi
      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Glassmacs.app" "$RUNNER_TEMP/Glassmacs-macOS.zip"
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: Glassmacs-macOS-app
          path: ${{ runner.temp }}/Glassmacs-macOS.zip
          if-no-files-found: error

