name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  emacs-batch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox
          emacs --version
      - name: Run ERT tests
        run: ./scripts/test
      - name: Byte-compile Lisp modules
        run: |
          emacs -Q --batch -l init.el \
            --eval '(let ((byte-compile-dest-file-function
                           (lambda (file)
                             (expand-file-name (file-name-nondirectory file)
                                               temporary-file-directory))))
                      (dolist (file (directory-files "lisp" t "\\.el$"))
                        (byte-compile-file file)))'

  ess-r-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs, R and ESS
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox r-base-core elpa-ess
      - name: Run ERT with real ESS and R
        run: |
          ess_dir=$(dirname "$(dpkg -L elpa-ess | grep '/ess-site.el$' | head -n 1)")
          test -n "$ess_dir"
          EMACSLOADPATH="$ess_dir:" ./scripts/test

  macos-launcher:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift launcher package
        run: swift test --package-path macos
      - name: Build unsigned app bundle
        run: |
          ./scripts/build-macos-app "$RUNNER_TEMP/Glassmacs.app"
          test -x "$RUNNER_TEMP/Glassmacs.app/Contents/MacOS/GlassmacsLauncher"
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' \
            "$RUNNER_TEMP/Glassmacs.app/Contents/Info.plist" | grep -qx APPL
